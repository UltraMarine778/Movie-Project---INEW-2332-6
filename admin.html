<!DOCTYPE html>
<html>
<head>
    <title>Admin - TwoKies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <div class="brand">TwoKies</div>
        <div class="nav-links"><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="admin.html">Admin</a></div>
    </nav>
</header>
<main>
    <div class="container">
        <div id="loginSection" class="admin-box">
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Password">
            <button id="loginBtn" class="wide-btn">Login</button>
            <p id="loginMessage"></p>
        </div>

        <div id="adminMenu" class="admin-box" style="display:none;">
            <h2>Menu</h2>
            <button class="wide-btn" id="goMoviesBtn">Manage Movies</button>
            <button class="wide-btn" id="goScheduleBtn">Theaters & Scheduling</button>
            <button class="wide-btn" id="goConcessionsBtn">Concessions & Inventory</button>
            <button class="wide-btn" id="goReportsBtn">Reports</button>
            <button class="wide-btn secondary" id="logoutBtn">Logout</button>
        </div>

        <div id="movieAdmin" class="admin-box" style="display:none;">
            <h2>Catalog</h2>
            <input type="text" id="catalogTitle" placeholder="Movie Title">
            <input type="text" id="catalogDescription" placeholder="Description">
            <input type="text" id="catalogGenre" placeholder="Genre">
            <input type="number" id="catalogRuntime" placeholder="Runtime">
            <button id="saveCatalogMovieBtn" class="wide-btn">Save Movie</button>
            <ul id="catalogList"></ul>
        </div>

        <div id="concessionAdmin" class="admin-box" style="display:none;">
            <h2>Concessions</h2>
            <input type="text" id="conName" placeholder="Item Name">
            <input type="number" id="conPrice" step="0.01" placeholder="Price">
            <input type="number" id="conStock" placeholder="Initial Stock">
            <button id="saveConcessionBtn" class="wide-btn">Save Item</button>
            <ul id="adminConcessionList"></ul>
        </div>

        <div id="scheduleAdmin" class="admin-box" style="display:none;">
            <h2>Theaters</h2>
            <input type="text" id="newTheaterName" placeholder="Theater Name">
            <button id="addTheaterBtn">Add Theater</button>
            <select id="audTheaterSelect"></select>
        </div>

        <div id="reportAdmin" class="admin-box" style="display:none;"><h2>Reports</h2><div id="reportOutput"></div></div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
