<!DOCTYPE html>
<html>
<head>
    <title>Admin - TwoKies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <div class="brand">TwoKies</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="schedule.html">View Schedule</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>
</header>

<main>
<div class="container">

    <!-- LOGIN -->
    <div id="loginSection" class="admin-box">
        <h2>Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="checkPassword()">Login</button>
        <p id="loginMessage"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="adminPanel" class="admin-box" style="display:none;">
        <h2>Admin Dashboard</h2>

        <button onclick="showSection('moviesSection')">Create Movies</button>
        <button onclick="showSection('scheduleSection')">Schedule Showtimes</button>
        <button onclick="showSection('reportSection')">Reports</button>

        <!-- CREATE MOVIES -->
        <div id="moviesSection" style="display:none;">
            <h3>Create Movie</h3>
            <input id="movieTitle" placeholder="Title">
            <input id="movieDescription" placeholder="Description">
            <input id="movieGenre" placeholder="Genre">
            <input id="movieRuntime" type="number" placeholder="Runtime">
            <button onclick="addMovieDefinition()">Save Movie</button>
            <p id="movieMsg"></p>
        </div>

        <!-- SCHEDULE -->
        <div id="scheduleSection" style="display:none;">
            <h3>Schedule Showtime</h3>

            <select id="movieSelect"></select>
            <input type="date" id="movieDate">
            <input id="movieTime" placeholder="Time">
            <select id="theaterSelect"></select>
            <input type="number" id="movieCapacity" placeholder="Capacity">

            <button onclick="scheduleMovie()">Schedule</button>

            <h4>Add Theater</h4>
            <input id="newTheaterName" placeholder="New Theater">
            <button onclick="addTheater()">Add Theater</button>
        </div>

        <!-- REPORTS -->
        <div id="reportSection" style="display:none;">
            <h3>Sales Report</h3>

            <input type="date" id="reportStart">
            <input type="date" id="reportEnd">
            <button onclick="generateReport()">Generate</button>

            <ul id="reportResults"></ul>
        </div>

    </div>
</div>
</main>

<footer>
    <p>© 2026 TwoKies Cinema</p>
</footer>

<script src="script.js"></script>
</body>
</html>
