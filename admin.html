<!DOCTYPE html>
<html>
<head>
  <title>Admin - TwoKies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <div class="brand">TwoKies</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="schedule.html">View Schedule</a>
        <a href="admin.html">Admin</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div id="loginSection" class="admin-box">
        <h2>Admin Login</h2>

        <label>Password</label>
        <input type="password" id="adminPassword">

        <button id="loginBtn">Login</button>
        <p id="loginMessage"></p>
      </div>

      <div id="adminPanel" class="admin-box" style="display:none;">
        <h2>Schedule Showtimes</h2>

        <label>Movie Title</label>
        <input type="text" id="movieTitle">

        <label>Description</label>
        <input type="text" id="movieDescription">

        <label>Genre</label>
        <input type="text" id="movieGenre">

        <label>Runtime (minutes)</label>
        <input type="number" id="movieRuntime">

        <label>Showtime</label>
        <input type="text" id="movieTime">

        <label>Date</label>
        <input type="date" id="movieDate">

        <label>Location</label>
        <select id="movieLocation">
          <option>North Theater</option>
          <option>Downtown Theater</option>
          <option>West Theater</option>
        </select>

        <button id="addMovieBtn">Add Movie</button>
        <p id="adminMessage"></p>

        <h3>Current Schedule</h3>
        <ul id="movieList"></ul>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TwoKies Cinema</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
