<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <div class="brand">TwoKies</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="schedule.html">View Schedule</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>
</header>

<main>
<div class="container">

<!-- LOGIN -->
<div id="loginSection" class="admin-box">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button onclick="checkPassword()">Login</button>
    <p id="loginMessage"></p>
</div>

<!-- MENU -->
<div id="adminMenu" class="admin-box" style="display:none;">
    <button onclick="showSection('movies')">Movies</button>
    <button onclick="showSection('schedule')">Scheduling</button>
    <button onclick="showSection('concessions')">Concessions</button>
    <button onclick="showSection('pos')">POS</button>
    <button onclick="showSection('inventory')">Inventory</button>
    <button onclick="showSection('reports')">Reports</button>
</div>

<!-- MOVIES -->
<div id="movies" class="admin-box" style="display:none;">
    <h2>Movie Catalog</h2>
    <input id="mTitle" placeholder="Title">
    <input id="mGenre" placeholder="Genre">
    <input id="mRuntime" type="number" placeholder="Runtime">
    <input id="mDesc" placeholder="Description">
    <button onclick="addMovie()">Add</button>
    <ul id="movieCatalog"></ul>
</div>

<!-- SCHEDULING -->
<div id="schedule" class="admin-box" style="display:none;">
    <h2>Schedule Showtime</h2>
    <select id="schedTheater"></select>
    <select id="schedAud"></select>
    <select id="schedMovie"></select>
    <input type="date" id="schedDate">
    <input id="schedTime" placeholder="Time">
    <input type="number" id="schedCap" placeholder="Capacity">
    <button onclick="scheduleShowtime()">Schedule</button>
    <ul id="showtimeList"></ul>
</div>

<!-- CONCESSIONS -->
<div id="concessions" class="admin-box" style="display:none;">
    <h2>Concessions</h2>
    <input id="cName" placeholder="Name">
    <input id="cCat" placeholder="Category">
    <input id="cPrice" type="number" step="0.01" placeholder="Price">
    <select id="cActive">
        <option value="true">Active</option>
        <option value="false">Inactive</option>
    </select>
    <button onclick="addConcession()">Add</button>
    <ul id="concessionList"></ul>
</div>

<!-- POS -->
<div id="pos" class="admin-box" style="display:none;">
    <h2>Concession POS</h2>
    <select id="posTheater"></select>
    <ul id="posItems"></ul>
    <button onclick="completePosSale()">Complete Sale</button>
</div>

<!-- INVENTORY -->
<div id="inventory" class="admin-box" style="display:none;">
    <h2>Inventory</h2>
    <select id="invItem"></select>
    <select id="invTheater"></select>
    <input type="number" id="invQty" placeholder="+/- Qty">
    <input id="invReason" placeholder="Reason">
    <button onclick="adjustInventory()">Apply</button>
</div>

<!-- REPORTS -->
<div id="reports" class="admin-box" style="display:none;">
    <h2>Reports</h2>
    <select id="reportTheater"></select>
    <input type="date" id="repStart">
    <input type="date" id="repEnd">
    <button onclick="generateReport()">Generate</button>
    <div id="reportOut"></div>
</div>

</div>
</main>

<footer>
    <p>© 2026 TwoKies Cinema</p>
</footer>

<script src="script.js"></script>
</body>
</html>
