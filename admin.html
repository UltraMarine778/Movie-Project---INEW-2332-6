<!DOCTYPE html>
<html>
<head>
    <title>Admin - TwoKies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <div class="brand">TwoKies</div>
        <div class="nav-links"><a href="index.html">Home</a><a href="schedule.html">POS/Schedule</a><a href="admin.html">Admin</a></div>
    </nav>
</header>
<main>
    <div class="container">
        <div id="loginSection" class="admin-box">
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Password">
            <button id="loginBtn" class="wide-btn">Login</button>
            <p id="loginMessage"></p>
        </div>

        <div id="adminMenu" class="admin-box" style="display:none;">
            <h2>Admin Panel</h2>
            <button class="wide-btn" id="goMoviesBtn">Manage Movies</button>
            <button class="wide-btn" id="goConcessionsBtn">Concessions & Inventory</button>
            <button class="wide-btn" id="goReportsBtn">Reports & Logs</button>
            <button class="wide-btn secondary" id="logoutBtn">Logout</button>
        </div>

        <div id="concessionAdmin" class="admin-box" style="display:none;">
            <h2>Inventory Management</h2>
            <input type="text" id="conName" placeholder="Item Name">
            <select id="conCategory">
                <option value="Snacks">Snacks</option>
                <option value="Drinks">Drinks</option>
                <option value="Meals">Meals</option>
            </select>
            <input type="number" id="conPrice" step="0.01" placeholder="Price">
            <input type="number" id="conStock" placeholder="Initial Stock">
            <button id="saveConcessionBtn" class="wide-btn">Add to Inventory</button>
            <ul id="adminConcessionList"></ul>
            <button class="wide-btn secondary" onclick="showAdminSection('adminMenu')">Back</button>
        </div>

        <div id="reportAdmin" class="admin-box" style="display:none;">
            <h2>System Reports</h2>
            <div id="reportOutput" class="report-output"></div>
            <button class="wide-btn secondary" onclick="showAdminSection('adminMenu')">Back</button>
        </div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
