<!DOCTYPE html>
<html>
<head>
    <title>Admin - TwoKies Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <div class="brand">TwoKies</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>
</header>
<main>
    <div class="container">
        <div id="loginSection" class="admin-box">
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Password">
            <button id="loginBtn" class="wide-btn">Login</button>
            <p id="loginMessage"></p>
        </div>

        <div id="adminMenu" class="admin-box" style="display:none;">
            <h2>Admin Panel</h2>
            <button class="wide-btn" id="goMoviesBtn">1) Manage Movie Catalog</button>
            <button class="wide-btn" id="goScheduleBtn">2) Theaters & Scheduling</button>
            <button class="wide-btn" id="goConcessionsBtn">3) Concessions & Inventory</button>
            <button class="wide-btn" id="goReportsBtn">4) Reports & Sales</button>
            <button class="wide-btn secondary" id="logoutBtn" style="margin-top:20px; background:#666;">Logout</button>
        </div>

        <div id="movieAdmin" class="admin-box" style="display:none;">
            <h2>Manage Movie Catalog</h2>
            <input type="text" id="catalogTitle" placeholder="Movie Title">
            <input type="text" id="catalogGenre" placeholder="Genre">
            <button id="saveCatalogMovieBtn" class="wide-btn">Add Movie to Catalog</button>
            <hr>
            <ul id="catalogList" style="text-align: left;"></ul>
            <button class="wide-btn secondary" onclick="showAdminSection('adminMenu')">Back to Menu</button>
        </div>

        <div id="scheduleAdmin" class="admin-box" style="display:none;">
            <h2>Theaters & Scheduling</h2>
            <input type="text" id="newTheaterName" placeholder="New Theater Name">
            <button id="addTheaterBtn" class="wide-btn">Create Theater</button>
            <hr>
            <h3>Schedule a Showtime</h3>
            <label>Select Theater:</label>
            <select id="schedTheater"></select>
            <label>Select Movie:</label>
            <select id="schedMovie"></select>
            <label>Time:</label>
            <input type="time" id="schedTime">
            <button id="saveShowtimeBtn" class="wide-btn">Save Showtime</button>
            <br>
            <button class="wide-btn secondary" onclick="showAdminSection('adminMenu')">Back to Menu</button>
        </div>

        <div id="concessionAdmin" class="admin-box" style="display:none;">
            <h2>Inventory Management</h2>
            <input type="text" id="conName" placeholder="Item Name">
            <select id="conCategory" style="margin-bottom:10px;">
                <option value="Snacks">Snacks</option>
                <option value="Drinks">Drinks</option>
                <option value="Meals">Meals</option>
            </select>
            <input type="number" id="conPrice" step="0.01" placeholder="Price (e.g. 5.50)">
            <input type="number" id="conStock" placeholder="Initial Stock Quantity">
            <button id="saveConcessionBtn" class="wide-btn">Add Item to Inventory</button>
            <hr>
            <ul id="adminConcessionList" style="text-align:left; list-style:none; padding:0;"></ul>
            <button class="wide-btn secondary" onclick="showAdminSection('adminMenu')">Back to Menu</button>
        </div>

        <div id="reportAdmin" class="admin-box" style="display:none;">
            <h2>System Reports</h2>
            <div id="reportOutput" style="text-align:left; max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: #fafafa;">
                </div>
            <br>
            <button class="wide-btn secondary" onclick="showAdminSection('adminMenu')">Back to Menu</button>
        </div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
